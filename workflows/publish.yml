name: Publish to Plugin Hub

on:
  push:
    branches: [main]

jobs:
  update-middleman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Get latest commit SHA and message
        id: sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "msg=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Checkout middleman repo
        uses: actions/checkout@v4
        with:
          repository: Car-Role/plugin-hub
          token: ${{ secrets.MIDDLEMAN_PAT }}
          ref: Distraction-Reducer

      - name: Update distraction-reducer file
        run: |
          echo "repository=https://github.com/Car-Role/Distraction-Reducer.git" > distraction-reducer
          echo "commit=${{ steps.sha.outputs.sha }}" >> distraction-reducer

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add distraction-reducer
          git diff --cached --quiet && echo "No changes, skipping" && exit 0
          git commit -m "Update Distraction-Reducer to ${{ steps.sha.outputs.sha }}"
          git push

      - name: Open PR to plugin hub (if not already open)
        env:
          GH_TOKEN: ${{ secrets.MIDDLEMAN_PAT }}
        run: |
          gh pr create \
            --repo runelite/plugin-hub \
            --head Car-Role:Distraction-Reducer \
            --base master \
            --title "Distraction-Reducer: ${{ steps.sha.outputs.msg }}" \
            --body "Automated update from commit ${{ steps.sha.outputs.sha }}: ${{ steps.sha.outputs.msg }}" \
            || echo "PR already open, branch updated — no action needed"
